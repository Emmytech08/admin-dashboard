<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4fcfe">
<title>Health Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a0a5c;
    --slate: #52649a;
    --menu-ink: #4a4e94;
    --blue: #0a86bd;
    --cyan-100: #d9fdfd;
    --cyan-200: #a8f0fb;
    --line: #1f93c8;
    --track: #d9d9d9;
    --status: #0a86bd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    color: var(--navy);
    background: linear-gradient(180deg, #f6fdff 0%, #eafefe 100%) fixed;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; text-align: inherit; }
  input { font: inherit; }
  a { color: inherit; }
  button:focus-visible, input:focus-visible, .card:focus-visible, [role="button"]:focus-visible {
    outline: 3px solid var(--blue); outline-offset: 3px;
  }
  [hidden] { display: none !important; }

  /* ---------- Views ---------- */
  .view { display: none; min-height: 100vh; }
  .view.active { display: block; animation: enter .3s ease both; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }
  .view h1:focus { outline: none; }

  .wrap {
    width: 100%; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) clamp(20px, 5vw, 40px) 64px;
  }
  .narrow { max-width: 560px; }

  /* ---------- Shared bits ---------- */
  .round-btn {
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    background: var(--cyan-200);
    transition: transform .15s, background .2s;
  }
  .round-btn:active:not(:disabled) { transform: scale(.92); }
  .round-btn svg { width: 22px; height: 22px; stroke: var(--navy); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .round-btn:disabled { background: #c5f2f8; cursor: default; }
  .round-btn:disabled svg { stroke: #7fa9c4; }
  .round-btn.danger { background: #f3dede; }
  .round-btn.danger svg { stroke: #8a4a4a; }

  h1 { font-size: clamp(28px, 6vw, 34px); font-weight: 800; letter-spacing: -.01em; }
  .lede { margin-top: 4px; font-size: 15px; color: var(--slate); }

  .btn {
    display: block; width: min(260px, 100%); margin: 26px auto 0;
    padding: 16px 0; border-radius: 20px; text-align: center;
    font-size: 21px; font-weight: 700; color: var(--navy);
    background: var(--cyan-100);
    border: 3px solid var(--line);
    box-shadow: inset 0 0 0 4px #e7fefe, 0 4px 0 rgba(31, 147, 200, .18);
    transition: transform .15s, box-shadow .15s, background .2s;
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 4px #e7fefe; }
  .btn:disabled { cursor: progress; background: #c4f5f7; }

  /* =====================================================
     DASHBOARD
     ===================================================== */
  .dash-wrap { max-width: 640px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .who {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px;
    padding: 4px; margin: -4px; border-radius: 40px;
    transition: background .2s;
  }
  .who:hover { background: rgba(168, 240, 251, .35); }
  .avatar {
    width: 60px; height: 60px; border-radius: 50%; object-fit: cover; flex: none;
    box-shadow: 0 6px 14px rgba(20, 70, 160, .3);
    background: #2c8cf0;
  }
  .hello small { display: block; font-size: 16px; color: #2b3a8c; font-weight: 500; }
  .hello strong { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; }

  .dash { margin-top: 0; }
  .dash h1 { margin-top: 26px; }

  .gauge { position: relative; margin: 18px auto 0; width: 100%; max-width: 360px; aspect-ratio: 340 / 235; container-type: inline-size; }
  .gauge svg { width: 100%; height: 100%; overflow: visible; }
  .gauge .track { stroke: var(--track); }
  .gauge .bar { transition: stroke .4s; filter: drop-shadow(0 3px 4px rgba(0, 110, 170, .35)); }
  .gauge-text { position: absolute; left: 0; right: 0; top: 42%; text-align: center; }
  .score { font-family: "Syne", sans-serif; font-weight: 800; font-size: 64px; font-size: 19cqw; line-height: 1; letter-spacing: -.02em; }
  .score span { font-size: 26px; font-size: 7.6cqw; color: #5a6a9a; letter-spacing: 0; }
  .gauge-text .label { margin-top: 6px; font-size: 16px; }
  .gauge-text .status { margin-top: 10px; font-size: 24px; font-weight: 700; color: var(--status); transition: color .4s; }

  .acts-head { margin-top: 44px; display: flex; align-items: center; gap: 12px; }
  .acts-head h2 { flex: 1; font-size: clamp(28px, 6vw, 32px); font-weight: 800; letter-spacing: -.01em; }
  .viewport { margin-top: 24px; overflow: hidden; touch-action: pan-y; }
  .pages { display: flex; transition: transform .45s cubic-bezier(.3, .8, .3, 1); }
  .page { flex: 0 0 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .card {
    position: relative; overflow: hidden;
    aspect-ratio: 1 / .99;
    padding: 18px 16px;
    border-radius: 28px;
    background: var(--bg); color: var(--ink);
    text-align: left; display: flex; flex-direction: column;
    transition: transform .15s;
  }
  .card:active { transform: scale(.97); }
  .card h3 { font-size: 18px; font-weight: 600; }
  .card .mark {
    position: absolute; right: -14px; bottom: -14px; width: 62%; opacity: .16;
    fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  .card .hint { margin: auto; text-align: center; font-size: 17px; line-height: 1.25; color: var(--sub); font-weight: 500; padding: 0 8px 14px; }
  .card .reading { display: none; margin: auto 0; }
  .card.open .hint { display: none; }
  .card.open .reading { display: block; animation: enter .25s ease both; }
  .reading b { font-size: 40px; font-weight: 800; line-height: 1; color: #111; }
  .reading b small { font-size: 16px; font-weight: 500; margin-left: 4px; color: var(--ink); }
  .reading p { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--sub); }

  .info-btn {
    position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%;
    border: 1.6px solid var(--ink); display: grid; place-items: center;
    font-size: 15px; font-weight: 600; font-family: Georgia, serif; font-style: italic; color: var(--ink); z-index: 2;
  }
  .hr-value { margin-top: 6px; display: flex; align-items: baseline; gap: 6px; }
  .hr-value b { font-size: 44px; font-weight: 800; line-height: 1; color: #111; }
  .hr-value span { font-size: 18px; color: #333; }
  .ecg { position: absolute; left: 0; right: 0; bottom: 8px; width: 100%; height: 42%; }
  .ecg path {
    fill: none; stroke: #6b3410; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 6px 4px rgba(107, 52, 16, .25)); stroke-dasharray: 100; animation: draw 4.2s ease-in-out infinite;
  }
  @keyframes draw {
    0% { stroke-dashoffset: 100; opacity: 1; }
    55% { stroke-dashoffset: 0; }
    88% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  .c-heart { --bg: #fbeaea; --ink: #5c0f0f; --sub: #8a4a4a; }
  .c-temp  { --bg: #d9fdfd; --ink: #0a0a5c; --sub: #4c6a9a; }
  .c-steps { --bg: #d9f6dc; --ink: #14561f; --sub: #2f7a3c; }
  .c-bp    { --bg: #f7e9d3; --ink: #5a2a05; --sub: #a57420; }
  .c-spo2  { --bg: #e5e6fb; --ink: #23246b; --sub: #5a5db0; }
  .c-sleep { --bg: #ece0fa; --ink: #3d1a6b; --sub: #7c55b2; }
  .c-cal   { --bg: #fde6d8; --ink: #6b2a0a; --sub: #b0623a; }
  .c-water { --bg: #dcecfd; --ink: #0d3560; --sub: #3f75ad; }

  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 22px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #b7e6ee; transition: width .3s, background .3s; }
  .dots i.on { width: 22px; border-radius: 6px; background: var(--line); }

  /* Tablet: bigger single column */
  @media (min-width: 600px) {
    .dash-wrap { max-width: 720px; }
    .page { gap: 20px; }
    .gauge { max-width: 400px; }
  }

  /* Desktop: two columns, every activity visible */
  @media (min-width: 900px) {
    .dash-wrap { max-width: 1140px; }
    .dash { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 72px; align-items: start; margin-top: 12px; }
    .summary { position: sticky; top: 28px; }
    .dash h1 { margin-top: 0; }
    .acts-head { margin-top: 0; }
    .acts-head .round-btn, .dots { display: none; }
    .viewport { overflow: visible; margin-top: 24px; }
    .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; transform: none !important; transition: none; }
    .page { display: contents; }
    .card { aspect-ratio: 1 / .88; }
  }

  /* =====================================================
     PROFILE
     ===================================================== */
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .hero { margin-top: clamp(20px, 6vw, 40px); text-align: center; }
  .ring {
    width: clamp(150px, 42vw, 200px); aspect-ratio: 1; margin: 0 auto;
    border-radius: 50%; object-fit: cover; display: block;
    border: 4px solid #e9fefe;
    box-shadow: 0 0 0 5px var(--blue), 0 12px 28px rgba(10, 80, 140, .28);
    background: #2c8cf0;
  }
  .hero h1 { margin-top: 28px; font-size: clamp(30px, 8vw, 40px); }
  .hero .mail { margin-top: 4px; font-size: 16px; font-weight: 500; color: #3f4f9a; }

  .menu {
    margin-top: 44px; background: #fff; border-radius: 28px; overflow: hidden;
    box-shadow: 0 14px 40px rgba(10, 100, 140, .1);
  }
  .row {
    width: 100%; display: flex; align-items: center; gap: 16px;
    padding: 0 clamp(20px, 5vw, 32px); min-height: 78px;
    font-size: clamp(18px, 4.6vw, 21px); font-weight: 500; color: var(--menu-ink);
    transition: background .2s;
  }
  .row + .row { border-top: 1.5px solid #d3d3d8; }
  .row:hover { background: #f4fdff; }
  .row:focus-visible { outline-offset: -3px; }
  .row .ico { width: 28px; height: 28px; flex: none; color: #16174f; }
  .row .ico.blank { visibility: hidden; }
  .row .label { flex: 1; }
  .row .chev { width: 22px; height: 22px; stroke: var(--navy); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .switch { width: 50px; height: 30px; border-radius: 999px; background: #c9d3dc; position: relative; transition: background .25s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s; }
  .row[aria-checked="true"] .switch { background: var(--blue); }
  .row[aria-checked="true"] .switch::after { transform: translateX(20px); }

  /* =====================================================
     LOGIN
     ===================================================== */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; }
  .login-card { width: 100%; max-width: 440px; }
  .brand { width: 84px; height: 84px; border-radius: 50%; background: var(--cyan-200); display: grid; place-items: center; margin-bottom: 26px; }
  .brand svg { width: 46px; height: 46px; fill: none; stroke: var(--navy); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .field { margin-top: 20px; }
  .field label { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 600; }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%; height: 56px; padding: 0 16px; border-radius: 16px;
    border: 2px solid #bfeaf2; background: #fff; color: var(--navy); font-size: 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-wrap input::placeholder { color: #8fa3c0; }
  .input-wrap input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(10, 134, 189, .15); }
  .input-wrap input[aria-invalid="true"] { border-color: #c0392b; }
  .input-wrap input.has-toggle { padding-right: 76px; }
  .reveal { position: absolute; right: 8px; top: 8px; height: 40px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--blue); }
  .err { min-height: 20px; margin-top: 6px; font-size: 13px; font-weight: 600; color: #c0392b; }
  .forgot { margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .login-card .btn { width: 100%; }
  .hint-line { margin-top: 22px; text-align: center; font-size: 13px; color: var(--slate); }

  @media (min-width: 600px) {
    .login-card { background: #fff; border-radius: 32px; padding: 44px 40px; box-shadow: 0 24px 60px rgba(10, 100, 140, .14); }
    .login-wrap { padding-top: 40px; padding-bottom: 40px; }
    .login-card .btn { width: 100%; }
  }

  /* =====================================================
     SHEET + TOAST
     ===================================================== */
  .overlay { position: fixed; inset: 0; background: rgba(6, 16, 60, .35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    transform: translate(-50%, 105%); transition: transform .35s cubic-bezier(.3, .8, .3, 1);
    background: #f8feff; border-radius: 28px 28px 0 0; padding: 12px 24px calc(30px + env(safe-area-inset-bottom)); z-index: 21;
    box-shadow: none;
  }
  .sheet.show { transform: translate(-50%, 0); box-shadow: 0 -12px 40px rgba(10, 40, 90, .2); }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #bcdde6; margin: 0 auto 18px; }
  .sheet h4 { font-size: 22px; font-weight: 800; }
  .sheet p { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--slate); }
  .sheet .range { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--cyan-100); font-size: 14px; font-weight: 600; }
  .sheet .close { margin-top: 22px; width: 100%; padding: 14px; border-radius: 16px; background: var(--cyan-200); font-weight: 700; font-size: 16px; text-align: center; }
  .dl { margin-top: 16px; }
  .dl div { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1.5px solid #dbeef2; font-size: 15px; }
  .dl div:last-child { border-bottom: 0; }
  .dl dt { color: var(--slate); font-weight: 500; }
  .dl dd { font-weight: 700; text-align: right; }

  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cal-head h4 { flex: 1; }
  .cal-head .round-btn { width: 40px; height: 40px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .cal-grid .dow { font-size: 12px; color: var(--slate); font-weight: 600; padding-bottom: 4px; }
  .cal-grid button { aspect-ratio: 1; border-radius: 50%; font-size: 15px; font-weight: 600; text-align: center; }
  .cal-grid button:hover { background: var(--cyan-100); }
  .cal-grid button.today { border: 2px solid var(--line); }
  .cal-grid button.sel { background: var(--blue); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 30px); opacity: 0;
    background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: transform .3s, opacity .3s; z-index: 30; pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (min-width: 700px) {
    .sheet { bottom: 50%; border-radius: 28px; transform: translate(-50%, 60%); opacity: 0; pointer-events: none; transition: transform .3s, opacity .25s; }
    .sheet.show { transform: translate(-50%, 50%); opacity: 1; pointer-events: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<!-- ================= DASHBOARD ================= -->
<section class="view" id="view-dashboard" aria-label="Health summary">
  <div class="wrap dash-wrap">
    <header class="top">
      <button class="who" id="profileLink" aria-label="Open your profile">
        <img class="avatar" data-photo alt="">
        <span class="hello">
          <small id="greeting">Good morning,</small>
          <strong>Marry Kumuyi</strong>
        </span>
      </button>
      <button class="round-btn" id="calBtn" aria-label="Open calendar">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
    </header>

    <div class="dash">
      <div class="summary">
        <h1 tabindex="-1">Health Summary</h1>
        <p class="lede">Your health status, summarised by AI.</p>

        <div class="gauge" aria-live="polite">
          <svg viewBox="0 0 340 235" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" style="stop-color: var(--g1, #0a7fb8)"/>
                <stop offset="1" style="stop-color: var(--g2, #1a8fc8)"/>
              </linearGradient>
            </defs>
            <path id="track" class="track" pathLength="100" fill="none" stroke-width="30" stroke-linecap="round"/>
            <path id="bar" class="bar" pathLength="100" fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round"/>
          </svg>
          <div class="gauge-text">
            <div class="score"><em id="scoreNum" style="font-style:normal">76</em><span>/100</span></div>
            <div class="label">Health score</div>
            <div class="status" id="status">Optimal</div>
          </div>
        </div>

        <button class="btn" id="scanBtn">Run Scan</button>
      </div>

      <section class="activities">
        <div class="acts-head">
          <h2>Activities</h2>
          <button class="round-btn" id="prev" aria-label="Previous activities" disabled>
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="round-btn" id="next" aria-label="Next activities">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="viewport" id="viewport">
          <div class="pages" id="pages"></div>
        </div>
        <div class="dots" id="dots"></div>
      </section>
    </div>
  </div>
</section>

<!-- ================= PROFILE ================= -->
<section class="view" id="view-profile" aria-label="Profile">
  <div class="wrap narrow">
    <div class="bar">
      <button class="round-btn" id="backBtn" aria-label="Back to dashboard">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="round-btn danger" id="logoutBtn" aria-label="Log out">
        <svg viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 00-2 2v12a2 2 0 002 2h4M15 8l4 4-4 4M19 12H9"/></svg>
      </button>
    </div>

    <div class="hero">
      <img class="ring" data-photo alt="Mary Kumuyi">
      <h1 tabindex="-1">Mary Kumuyi</h1>
      <p class="mail">maryk896@gmail.com</p>
    </div>

    <div class="menu">
      <button class="row" data-open="personal">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="2.5" width="15" height="18" rx="3" fill="currentColor"/><path d="M7.5 8.5h7M7.5 12.5h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="18" cy="18" r="3.6" fill="currentColor" stroke="#fff" stroke-width="1.5"/></svg>
        <span class="label">Personal info</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="row" data-open="medical">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="3" fill="currentColor"/><path d="M12 7.5v5M9.5 10h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M8 16.5h8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="label">Medical history</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="row" id="notifRow" role="switch" aria-checked="true">
        <span class="ico blank" aria-hidden="true"></span>
        <span class="label">Notifications</span>
        <span class="switch" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</section>

<!-- ================= LOGIN ================= -->
<section class="view" id="view-login" aria-label="Log in">
  <div class="wrap login-wrap">

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const rnd = (a, b) => Math.round(a + Math.random() * (b - a));
  const rndf = (a, b) => (a + Math.random() * (b - a)).toFixed(1);

  /* =====================================================
     Toast + sheet
     ===================================================== */
  let tt;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
  }

  const sheet = $('#sheet'), overlay = $('#overlay');
  let lastFocus = null;
  function openSheet(html) {
    if (!sheet.classList.contains('show')) lastFocus = document.activeElement;
    sheet.innerHTML = '<div class="grab"></div>' + html;
    sheet.classList.add('show'); overlay.classList.add('show');
    sheet.setAttribute('aria-hidden', 'false');
    const c = $('.close', sheet); c && c.focus({ preventScroll: true });
  }
  function closeSheet() {
    sheet.classList.remove('show'); overlay.classList.remove('show');
    sheet.setAttribute('aria-hidden', 'true');
    lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
  }
  overlay.onclick = closeSheet;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  /* =====================================================
     Router (hash based, so the browser back button works)
     ===================================================== */
  let authed = true;
  const views = { dashboard: $('#view-dashboard'), profile: $('#view-profile'), login: $('#view-login') };
  const enter = { dashboard: onDashboard, profile: () => {}, login: onLogin };

  function navigate(name) { location.hash = '#/' + name; }

  function route() {
    let name = location.hash.replace(/^#\//, '') || 'dashboard';
    if (!views[name]) name = 'dashboard';
    if (!authed && name !== 'login') { location.replace('#/login'); return; }
    if (authed && name === 'login') { location.replace('#/dashboard'); return; }

    closeSheet();
    Object.entries(views).forEach(([k, el]) => el.classList.toggle('active', k === name));
    window.scrollTo(0, 0);
    enter[name]();
    const h = $('h1', views[name]);
    h && h.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', route);

  /* =====================================================
     Gauge
     ===================================================== */
  const CX = 170, CY = 150, R = 125;
  const pt = (deg) => { const r = deg * Math.PI / 180; return [CX + R * Math.cos(r), CY - R * Math.sin(r)]; };
  const [sx, sy] = pt(195), [ex, ey] = pt(-15);
  const arc = `M${sx.toFixed(1)} ${sy.toFixed(1)} A${R} ${R} 0 1 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`;
  $('#track').setAttribute('d', arc);
  $('#bar').setAttribute('d', arc);

  const bar = $('#bar'), num = $('#scoreNum'), statusEl = $('#status'), gaugeEl = $('.gauge');
  let score = 0, lastScore = 76, animId = 0;

  function paintScore(v) {
    bar.style.strokeDasharray = `${Math.max(0.01, v)} 100`;
    num.textContent = Math.round(v);
  }
  function paintStatus(v) {
    let label = 'Optimal', color = '#0a86bd', g1 = '#0a7fb8', g2 = '#1a8fc8';
    if (v < 50) { label = 'Needs attention'; color = '#c0392b'; g1 = '#c0392b'; g2 = '#e0705f'; }
    else if (v < 70) { label = 'Fair'; color = '#b7791f'; g1 = '#b7791f'; g2 = '#e0a94a'; }
    statusEl.textContent = label;
    gaugeEl.style.setProperty('--status', color);
    gaugeEl.style.setProperty('--g1', g1);
    gaugeEl.style.setProperty('--g2', g2);
  }
  function animateTo(target, ms) {
    const id = ++animId;
    if (reduceMotion) ms = 0;
    return new Promise((res) => {
      const from = score, t0 = performance.now();
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      (function tick(now) {
        if (id !== animId) return res();
        const t = ms ? Math.min(1, (now - t0) / ms) : 1;
        score = from + (target - from) * ease(t);
        paintScore(score);
        t < 1 ? requestAnimationFrame(tick) : res();
      })(t0);
    });
  }

        <div class="reading">
          <b data-val="${m.id}">${m.value}<small>${m.unit}</small></b>
          <p data-note="${m.id}">${m.note(parseFloat(String(m.value).replace(',', '')))}</p>
        </div>
      </button>`;
  }

  const perPage = 4, pageCount = Math.ceil(metrics.length / perPage);
  const pagesEl = $('#pages'), dotsEl = $('#dots');
  for (let p = 0; p < pageCount; p++) {
    const el = document.createElement('div');
    el.className = 'page';
    el.innerHTML = metrics.slice(p * perPage, (p + 1) * perPage).map(cardHTML).join('');
    pagesEl.appendChild(el);
    dotsEl.insertAdjacentHTML('beforeend', '<i></i>');
  }

  let page = 0;
  const prev = $('#prev'), next = $('#next');
  function go(n) {
    page = Math.max(0, Math.min(pageCount - 1, n));
    pagesEl.style.transform = `translateX(${-page * 100}%)`;
    prev.disabled = page === 0;
    next.disabled = page === pageCount - 1;
    $$('i', dotsEl).forEach((el, i) => el.classList.toggle('on', i === page));
  }
  prev.onclick = () => go(page - 1);
  next.onclick = () => go(page + 1);
  go(0);

  let startX = null;
  const vp = $('#viewport');
  vp.addEventListener('pointerdown', (e) => { startX = e.clientX; });
  vp.addEventListener('pointerup', (e) => {
    if (startX === null) return;
    const dx = e.clientX - startX; startX = null;
    if (Math.abs(dx) > 50 && innerWidth < 900) go(page + (dx < 0 ? 1 : -1));
  });
  vp.addEventListener('pointercancel', () => { startX = null; });

  const infoText = {
    heart: metrics[0].info, range: metrics[0].range
  };

  pagesEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-info]')) { e.stopPropagation(); openHeartInfo(); return; }
    const card = e.target.closest('.card');
    if (!card) return;
    if (card.dataset.id === 'heart') { openHeartInfo(); return; }
    const open = card.classList.toggle('open');
    card.setAttribute('aria-expanded', open);
  });
  pagesEl.addEventListener('keydown', (e) => {
    if (e.target.closest('[data-info]') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); e.stopPropagation(); openHeartInfo();
    }
  });
  function openHeartInfo() {
    openSheet(`<h4>Heart Rate</h4><p>${infoText.heart}</p><div class="range">${infoText.range}</div><button class="close">Got it</button>`);
  }

  /* =====================================================
     Calendar
     ===================================================== */
  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  function renderCal() {
    const y = view.getFullYear(), mo = view.getMonth();
    const first = new Date(y, mo, 1).getDay();
    const days = new Date(y, mo + 1, 0).getDate();
    let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((x) => `<div class="dow">${x}</div>`).join('');
    cells += '<span></span>'.repeat(first);
    for (let i = 1; i <= days; i++) {
      const dt = new Date(y, mo, i);
      const cls = [dt.toDateString() === today.toDateString() ? 'today' : '', dt.toDateString() === selected.toDateString() ? 'sel' : ''].join(' ');
      cells += `<button class="${cls}" data-day="${i}">${i}</button>`;
    }
    const title = view.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    sheet.innerHTML = `<div class="grab"></div>
      <div class="cal-head">
        <h4>${title}</h4>
        <button class="round-btn" data-m="-1" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="round-btn" data-m="1" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="cal-grid">${cells}</div>
      <button class="close">Done</button>`;
  }
  $('#calBtn').onclick = () => { openSheet(''); renderCal(); };

  sheet.addEventListener('click', (e) => {
    if (e.target.closest('.close')) { closeSheet(); return; }
    const m = e.target.closest('[data-m]');
    if (m) { view = new Date(view.getFullYear(), view.getMonth() + Number(m.dataset.m), 1); renderCal(); return; }
    const day = e.target.closest('[data-day]');
    if (day) {
      selected = new Date(view.getFullYear(), view.getMonth(), Number(day.dataset.day));
      renderCal();
      toast(selected.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }));
    }
  });

  /* =====================================================
     Scan
     ===================================================== */
  const scanBtn = $('#scanBtn');
  function setMetric(id, value, unit) {
    const m = metrics.find((x) => x.id === id);
    m.value = value;
    const v = $(`[data-val="${id}"]`);
    if (v) v.innerHTML = `${value}<small>${unit}</small>`;
    const n = $(`[data-note="${id}"]`);
    if (n) n.textContent = m.note(parseFloat(String(value).replace(',', '')));
  }

  scanBtn.onclick = async () => {
    scanBtn.disabled = true;
    scanBtn.textContent = 'Scanning…';
    await animateTo(0, 700);
    const result = rnd(58, 96);
    lastScore = result;
    await animateTo(result, 1500);
    paintStatus(result);

    const hr = rnd(66, 92);
    metrics[0].value = hr; $('#hrVal').textContent = hr;
    setMetric('temp', rndf(36.2, 37.1), '°C');
    setMetric('bp', `${rnd(108, 126)}/${rnd(68, 82)}`, 'mmHg');
    setMetric('o2', rnd(95, 99), '%');

    scanBtn.disabled = false;
    scanBtn.textContent = 'Run Scan';
    toast(`Scan complete: ${result}/100`);
  };

  function onDashboard() {
    const h = new Date().getHours();
    $('#greeting').textContent = (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ',';
    score = 0; paintScore(0); paintStatus(lastScore);
    requestAnimationFrame(() => animateTo(lastScore, 1400));
  }

  /* =====================================================
     Profile
     ===================================================== */
  $('#profileLink').onclick = () => navigate('profile');
  $('#backBtn').onclick = () => navigate('dashboard');
  $('#logoutBtn').onclick = () => {
    authed = false;
    navigate('login');
    setTimeout(() => toast('You’ve been logged out'), 250);
  };

  const notif = $('#notifRow');
  notif.onclick = () => {
    const on = notif.getAttribute('aria-checked') !== 'true';
    notif.setAttribute('aria-checked', on);
    toast(on ? 'Notifications turned on' : 'Notifications turned off');
  };

  const details = {
    personal: { title: 'Personal info', rows: [
      ['Full name', 'Mary Kumuyi'], ['Email', 'maryk896@gmail.com'], ['Phone', '+234 801 234 5678'],
      ['Date of birth', '14 March 1991'], ['Gender', 'Female'], ['Blood group', 'O+']
    ] },
    medical: { title: 'Medical history', rows: [
      ['Conditions', 'None recorded'], ['Allergies', 'Penicillin'], ['Medications', 'None'],
      ['Last check-up', '12 August 2026'], ['Emergency contact', 'Not added']
    ] }
  };
  $$('[data-open]').forEach((btn) => btn.addEventListener('click', () => {
    const d = details[btn.dataset.open];
    openSheet(`<h4>${d.title}</h4><dl class="dl">${d.rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl><button class="close">Close</button>`);
  }));

  /* =====================================================
     Login
     ===================================================== */
  const form = $('#loginForm'), emailIn = $('#email'), passIn = $('#password');
  const emailErr = $('#emailErr'), passErr = $('#passErr'), loginBtn = $('#loginBtn');
  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

  function setErr(input, el, msg) {
    el.textContent = msg;
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  }
  emailIn.addEventListener('input', () => setErr(emailIn, emailErr, ''));
  passIn.addEventListener('input', () => setErr(passIn, passErr, ''));

  $('#reveal').onclick = (e) => {
    const show = passIn.type === 'password';
    passIn.type = show ? 'text' : 'password';
    e.currentTarget.textContent = show ? 'Hide' : 'Show';
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  };

  $('#forgot').onclick = () => {
    const v = emailIn.value.trim();
    if (!validEmail(v)) { setErr(emailIn, emailErr, 'Enter your email above and we’ll send a reset link.'); emailIn.focus(); return; }
    toast(`Reset link sent to ${v}`);
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailIn.value.trim(), pass = passIn.value;
    let ok = true;
    setErr(emailIn, emailErr, ''); setErr(passIn, passErr, '');
    if (!validEmail(email)) { setErr(emailIn, emailErr, 'Enter a valid email address, like name@example.com.'); ok = false; }
    if (pass.length < 6) { setErr(passIn, passErr, 'Password must be at least 6 characters.'); ok = false; }
    if (!ok) { (validEmail(email) ? passIn : emailIn).focus(); return; }

    loginBtn.disabled = true; loginBtn.textContent = 'Logging in…';
    await sleep(reduceMotion ? 0 : 900);
    loginBtn.disabled = false; loginBtn.textContent = 'Log in';
    passIn.value = '';
    authed = true;
    navigate('dashboard');
    setTimeout(() => toast('Welcome back, Mary'), 250);
  });

  function onLogin() {
    passIn.type = 'password';
    const r = $('#reveal'); r.textContent = 'Show'; r.setAttribute('aria-label', 'Show password');
  }

  /* =====================================================
     Init
     ===================================================== */
  route();
})();
</script>
</body>
</html>
